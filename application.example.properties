# ====================================================================
# College Club Management System - Example Configuration Template
# Copy or set the corresponding environment variables:
#   CLUB_DB_URL, CLUB_DB_USER, CLUB_DB_PASSWORD, CLUB_ADMIN_PASSWORD
# ====================================================================

# Option 1: H2 Embedded File Database (Default, no setup needed)
db.url=jdbc:h2:${user.home}/collegeclub-data/collegeclub;DB_CLOSE_DELAY=-1;MODE=MySQL
db.user=sa
db.password=
db.driver=org.h2.Driver

# Option 2: Local MySQL Database (Uncomment to use MySQL)
# db.url=jdbc:mysql://localhost:3306/college_club_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# db.user=root
# db.password=your_mysql_password
# db.driver=com.mysql.cj.jdbc.Driver

# Admin Initial Password (Overridden by CLUB_ADMIN_PASSWORD env variable)
app.admin.defaultPassword=Admin@123
