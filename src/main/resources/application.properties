# ====================================================================
# College Club Management System Configuration
# ====================================================================

# Database Configuration (Default: Embedded H2 file-based persistence)
# To use MySQL, set CLUB_DB_URL=jdbc:mysql://localhost:3306/college_club_db
db.url=jdbc:h2:${user.home}/collegeclub-data/collegeclub;DB_CLOSE_DELAY=-1;MODE=MySQL
db.user=sa
db.password=
db.driver=org.h2.Driver

# Cryptographic Password Settings
security.pbkdf2.iterations=600000

# Demo and Seeding Configuration
app.demoMode=true
app.admin.username=admin
app.admin.defaultPassword=Admin@123
