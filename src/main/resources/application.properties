# Database Configuration (MySQL 8.x Database Engine with Auto-Fallback to H2)
# Connects to MySQL on localhost:3306 database: college_club_db
db.url=jdbc:mysql://localhost:3306/college_club_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver

# Cryptographic Password Settings
security.pbkdf2.iterations=600000

# Demo and Seeding Configuration
app.demoMode=true
app.admin.username=admin
app.admin.defaultPassword=Admin@123
