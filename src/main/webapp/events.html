<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Events - College Club Management System</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .page-header {
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      background: radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 60%);
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 1.5rem auto 2rem;
      padding: 0 1.5rem;
    }
    .events-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header style="border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(10, 15, 30, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;">
      <a href="index.html" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff;">
        <div class="logo-badge">🏛️</div>
        <div>
          <div style="font-weight: 700; font-family: var(--font-heading);">CampusHub</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Campus Events</div>
        </div>
      </a>
      <nav style="display: flex; align-items: center; gap: 1.25rem;">
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Home</a>
        <a href="clubs.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Clubs</a>
        <a href="events.html" style="color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600;">Events</a>
        <a href="demo.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">XML Lab</a>
        <a href="login.html" id="authNavBtn" class="btn btn-primary btn-sm">Sign In</a>
      </nav>
    </div>
  </header>

  <!-- Page Header -->
  <div class="page-header">
    <div style="display: inline-block; padding: 4px 14px; background: rgba(6, 182, 212, 0.2); border: 1px solid rgba(6, 182, 212, 0.4); border-radius: 20px; font-size: 0.82rem; color: #38bdf8; margin-bottom: 0.75rem;">
      Workshops · Competitions · Hackathons
    </div>
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">College Events &amp; Activities</h1>
    <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto;">
      Participate in hands-on workshops, seminars, technical battles, and cultural celebrations.
    </p>
  </div>

  <!-- Filters & Search -->
  <div class="filter-bar">
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn btn-sm btn-primary status-btn" data-status="">All Events</button>
      <button class="btn btn-sm btn-ghost status-btn" data-status="OPEN">Open for Registration</button>
    </div>

    <div style="min-width: 260px;">
      <input type="text" id="eventSearch" class="input-field" placeholder="Search events or venues..." style="padding: 0.5rem 1rem;">
    </div>
  </div>

  <!-- Events Grid -->
  <div class="events-container">
    <div id="eventsGrid" class="cards-grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem 0; color: var(--text-muted);">
        Loading events...
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { api, session, showSuccess, showError, escapeHtml, formatDate } from './js/api.js';

    const authNavBtn = document.getElementById('authNavBtn');
    const user = session.get();
    if (user && user.username) {
      authNavBtn.textContent = `Profile (${user.username})`;
      authNavBtn.href = 'index.html';
    }

    const eventsGrid = document.getElementById('eventsGrid');
    const eventSearch = document.getElementById('eventSearch');
    const statusBtns = document.querySelectorAll('.status-btn');

    let currentStatus = '';
    let searchQuery = '';
    let allEvents = [];

    async function loadEvents() {
      try {
        const res = await api.events.list();
        if (res.success && res.data) {
          allEvents = res.data;
          renderEvents();
        } else {
          eventsGrid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--danger);">Failed to load events.</div>';
        }
      } catch (e) {
        eventsGrid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--danger);">Error connecting to events service.</div>';
      }
    }

    function renderEvents() {
      let filtered = allEvents.filter(e => {
        const matchStatus = !currentStatus || e.status === currentStatus;
        const matchSearch = !searchQuery ||
          e.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (e.venue && e.venue.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (e.clubName && e.clubName.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchStatus && matchSearch;
      });

      if (filtered.length === 0) {
        eventsGrid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📅</div>
            <h3>No events found matching your search</h3>
            <p style="font-size: 0.9rem;">Try searching for a different keyword.</p>
          </div>
        `;
        return;
      }

      eventsGrid.innerHTML = filtered.map(e => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <span class="badge badge-primary">${escapeHtml(e.clubName || 'Club Event')}</span>
            <span class="badge badge-success">${escapeHtml(e.status || 'OPEN')}</span>
          </div>
          <h3 style="font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem;">${escapeHtml(e.title)}</h3>
          <p style="color: var(--text-muted); font-size: 0.88rem; min-height: 44px; margin-bottom: 1.25rem;">
            ${escapeHtml(e.description || 'No description provided.')}
          </p>
          <div style="display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 1.25rem; padding: 0.75rem; background: rgba(0, 0, 0, 0.25); border-radius: var(--radius-sm);">
            <div>📅 <strong>Date:</strong> ${formatDate(e.eventDate)}</div>
            <div>📍 <strong>Venue:</strong> ${escapeHtml(e.venue || 'Campus Auditorium')}</div>
            <div>👥 <strong>Seats:</strong> ${e.registeredCount || 0} / ${e.capacity || 100} Registered</div>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <a href="event.html?id=${e.eventId}" class="btn btn-secondary btn-sm" style="flex: 1;">Details</a>
            <button class="btn btn-primary btn-sm register-btn" data-id="${e.eventId}" style="flex: 1;">Register</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.register-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.dataset.id;
          if (!session.get()) {
            showError('Please sign in to register for an event.');
            setTimeout(() => window.location.href = 'login.html', 1000);
            return;
          }
          try {
            const r = await api.events.register(id);
            if (r.success) {
              showSuccess('Registered for event successfully!');
            } else {
              showError(r.message || 'Registration failed.');
            }
          } catch (err) {
            showError(err.message || 'Could not complete registration.');
          }
        });
      });
    }

    statusBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        statusBtns.forEach(b => {
          b.classList.remove('btn-primary');
          b.classList.add('btn-ghost');
        });
        btn.classList.add('btn-primary');
        btn.classList.remove('btn-ghost');
        currentStatus = btn.dataset.status;
        renderEvents();
      });
    });

    eventSearch.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderEvents();
    });

    loadEvents();
  </script>
</body>
</html>
